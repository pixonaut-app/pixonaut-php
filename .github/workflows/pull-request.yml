name: Pull request

# Everything a pull request runs, on GitHub-hosted runners with read-only
# contents and no secrets, so a fork's pull request runs it too. The checks
# run through the same Docker wrappers as locally, on the minimum PHP and on
# the newest stable PHP.
on:
  pull_request:
    # `edited` re-runs the title check when only the title changes.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::The pull request title is not a Conventional Commits subject, e.g. 'fix(client): retry on 503'. It becomes the squash commit and the changelog entry."
            exit 1
          fi

  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The minimum the package supports, and the newest stable PHP.
        php: ['8.1', '8.5']
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bin/composer validate --strict
      - run: bin/composer install --no-interaction --no-progress
      - run: bin/spec check
      - run: bin/generate --check
      - run: bin/surface --check
      - run: bin/composer lint
      - run: bin/composer analyse
      # The unit and contract suites, in a container with no network but
      # loopback, so no test can reach a real host.
      - run: bin/composer test
        env:
          DOCKER_NETWORK: none

  surface:
    name: Breaking change marked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # A line of api-surface.txt the pull request removes or changes is a
      # change a caller may have to follow: the title must mark it breaking
      # (`feat!:`), so release-please releases a major.
      - name: Check the title marks a removed or changed public signature
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          removed="$(git diff --unified=0 "${BASE}" HEAD -- api-surface.txt | grep '^-[^-]' | cut -c2- || true)"
          if [ -z "${removed}" ]; then
            echo 'No public signature is removed or changed.'
            exit 0
          fi
          echo 'Removed or changed in api-surface.txt:'
          printf '%s\n' "${removed}"
          if printf '%s' "${TITLE}" | grep -Eq '^[a-z]+(\([a-z0-9._/-]+\))?!: '; then
            echo 'The title marks the change breaking.'
            exit 0
          fi
          echo "::error::This pull request removes or changes a public signature. Mark the title breaking, e.g. 'feat!: ...', or keep the old signature."
          exit 1

  prefixed:
    name: Prefixed with ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [strauss, scoper]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bin/composer install --no-interaction --no-progress
      # Prefixes the package, its dependencies and the quick-start examples,
      # then runs the examples and the webhook vectors on the prefixed copy.
      - run: tests/Prefixed/run ${{ matrix.tool }}
