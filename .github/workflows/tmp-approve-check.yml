name: Temporary approve check
on:
  pull_request:
permissions:
  actions: write
jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh api --method POST "repos/${GH_REPO}/actions/runs/43641857607/approve" -i
