name: Pinned spec

# Checks that the pinned spec is still the release the CDN publishes. The CDN
# is public, so the job needs no secrets. It runs weekly, on demand, and on a
# pull request that changes the pin; any other pull request checks the pin
# offline. It fails while the lock pins an unpublished reference
# ("published": false) until the published release is pinned.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'spec/**'
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  online:
    name: Pinned spec matches the CDN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bin/composer install --no-interaction --no-progress
      - run: bin/spec check --online
